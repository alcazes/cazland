<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoot’s Spelling Fun</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#BDE7FF;--bg2:#FFE9F3;--ink:#2b1b4d;--card:#fff;--soft:#fff8;--sh:#0002;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1d2a5c;--bg2:#3a1f4d;--ink:#fff4ff;--card:#3b3470;--soft:#fff2;--sh:#0006}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;min-height:100%;font-family:'Fredoka','Trebuchet MS','Comic Sans MS',sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;user-select:none}
.wrap{max-width:900px;margin:0 auto;padding:14px 14px 30px}
h1{font-size:clamp(28px,6vw,46px);margin:6px 0;text-align:center}
.screen{display:none}.screen.on{display:block}
.hero{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.hero .owl{width:clamp(130px,28vw,200px)}
.bubble{background:var(--card);border-radius:24px;padding:14px 18px;font-size:clamp(18px,3.5vw,24px);font-weight:600;box-shadow:0 4px 0 var(--sh);max-width:320px;position:relative}
.moods{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.mood{background:var(--soft);border-radius:18px;padding:6px 10px;text-align:center;font-size:13px;font-weight:600}
.mood .owl{width:64px;display:block;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:12px}
.fam{border:0;border-radius:26px;padding:16px 8px;color:#fff;font:inherit;cursor:pointer;box-shadow:0 6px 0 #0003;transition:transform .1s}
.fam:active{transform:translateY(5px);box-shadow:0 1px 0 #0003}
.fam b{display:block;font-size:clamp(30px,6vw,42px);text-shadow:0 2px 0 #0003}
.fam small{display:block;font-size:15px;opacity:.95}
.fam .st{font-size:18px;margin-top:4px;letter-spacing:2px}
.top{display:flex;align-items:center;gap:10px}
.btn{border:0;border-radius:20px;font:inherit;font-weight:700;font-size:clamp(16px,3.5vw,20px);padding:10px 16px;background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--sh);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.go{background:#FFB703;color:#4a2b00}
.prog{flex:1;display:flex;gap:6px;justify-content:center}
.dot{width:18px;height:18px;border-radius:50%;background:var(--soft);border:3px solid var(--card)}
.dot.now{background:#FFB703}.dot.done{background:#3DDC84}
.stage{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:6px}
.stage .owl{width:clamp(110px,24vw,170px)}
.pic{font-size:clamp(60px,14vw,100px);line-height:1;filter:drop-shadow(0 4px 0 var(--sh))}
.clue{font-size:clamp(18px,3.8vw,26px);font-weight:600;text-align:center}
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.slot{width:clamp(40px,11vw,64px);height:clamp(52px,14vw,76px);border-radius:16px;background:var(--card);border:4px dashed #aaa8;display:grid;place-items:center;font-size:clamp(28px,8vw,44px);font-weight:700;text-transform:lowercase;box-shadow:0 4px 0 var(--sh)}
.slot.end{border-color:var(--fc);border-style:solid}
.slot.pop{animation:pop .25s}
.slots.shake{animation:shake .4s}
.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.tile{width:clamp(48px,13vw,72px);height:clamp(48px,13vw,72px);border-radius:18px;border:0;font:inherit;font-weight:700;font-size:clamp(26px,7vw,40px);color:#fff;background:var(--fc);box-shadow:0 5px 0 #0003;cursor:pointer;text-transform:lowercase}
.tile:active{transform:translateY(4px);box-shadow:none}
.tile.used{visibility:hidden}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.owl{display:block;overflow:visible}
textarea{width:100%;max-width:560px;font:inherit;font-size:20px;padding:12px;border-radius:18px;border:4px solid var(--card);background:var(--card);color:var(--ink);user-select:text;-webkit-user-select:text}
.owl.idle .all,.owl.think .all{animation:bob 2.4s ease-in-out infinite}
.owl.happy .all,.owl.cheer .all{animation:hop .6s ease-in-out infinite}
.owl.sad .all{animation:sway 1s ease-in-out infinite}
.owl.sleep .all{animation:bob 4s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.big{font-size:clamp(26px,6vw,40px);text-align:center;font-weight:700}
.conf{position:fixed;top:-40px;font-size:28px;pointer-events:none;animation:fall 3s linear forwards;z-index:9}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes hop{50%{transform:translateY(-16px) rotate(-3deg)}}
@keyframes sway{50%{transform:rotate(-3deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes pop{50%{transform:scale(1.25)}}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style></head><body>
<div class="wrap">
<section id="home" class="screen on">
  <h1>🦉 Hoot’s Spelling Fun!</h1>
  <div class="hero"><div id="heroOwl"></div><div class="bubble">Hi, I’m Hoot! Pick a word family and let’s spell together!</div></div>
  <div class="moods" id="moods"></div>
  <div class="row" id="chips"><button class="btn" data-f="all">All</button><button class="btn" data-f="end">Endings -ab</button><button class="btn" data-f="start">Beginnings ab-</button><button class="btn" data-f="mid">Middle & double …ab…</button><button class="btn go" id="mixBtn">🎲 Mix</button><button class="btn go" id="myBtn">✏️ My Words</button></div>
  <div class="grid" id="grid"></div>
</section>
<section id="game" class="screen">
  <div class="top"><button class="btn" id="back">⬅ Home</button><div class="prog" id="prog"></div></div>
  <div class="stage">
    <div id="gOwl"></div>
    <div class="pic" id="pic"></div>
    <div class="clue" id="clue"></div>
    <div class="row"><button class="btn" id="say">🔊 Hear it</button><button class="btn" id="slow">🐢 Slowly</button></div>
    <div class="slots" id="slots"></div>
    <div class="tiles" id="tiles"></div>
    <div class="row"><button class="btn" id="undo">↩ Undo</button><button class="btn" id="hint">💡 Hint</button></div>
  </div>
</section>
<section id="custom" class="screen"><div class="top"><button class="btn" id="cBack">⬅ Home</button></div>
  <h1>✏️ My Words</h1>
  <div class="stage"><div class="bubble">Type your words, separated by commas or new lines. Or scan a spelling list with the camera!</div>
  <textarea id="cText" rows="6" placeholder="elephant, friend, because"></textarea>
  <div class="row"><button class="btn" id="scan">📷 Add photo of words</button><button class="btn go" id="cPlay">▶ Practice</button></div>
  <input type="file" id="file" accept="image/*" hidden>
  <img id="prev" alt="Your photo" style="display:none;max-width:100%;max-height:260px;border-radius:18px">
  <div class="clue" id="cMsg"></div></div></section>
<section id="end" class="screen">
  <div class="stage"><div id="eOwl"></div><div class="big" id="eTxt"></div><div class="big" id="eStars"></div>
  <div class="row"><button class="btn go" id="again">🔁 Play again</button><button class="btn" id="home2">🏠 Home</button></div></div>
</section>
</div>

/* ---------- Mascot: Hoot the owl, sprite states ---------- */
function owl(s){
  const happy=s==='happy'||s==='cheer',sad=s==='sad',think=s==='think',sleep=s==='sleep',cheer=s==='cheer'||s==='happy';
  const ink='#2b1b4d';let eyes;
  if(happy)eyes=`<path d="M56 90Q75 66 94 90M106 90Q125 66 144 90" fill="none" stroke="${ink}" stroke-width="7" stroke-linecap="round"/>`;
  else if(sleep)eyes=`<path d="M56 86Q75 102 94 86M106 86Q125 102 144 86" fill="none" stroke="${ink}" stroke-width="7" stroke-linecap="round"/><text x="150" y="40" font-size="24" fill="${ink}">z</text><text x="165" y="22" font-size="18" fill="${ink}">z</text>`;
  else{const px=think?6:0,py=think?-6:sad?5:0;
    eyes=`<g class="blink"><circle cx="75" cy="88" r="21" fill="#fff"/><circle cx="125" cy="88" r="21" fill="#fff"/><circle cx="${75+px}" cy="${88+py}" r="10" fill="${ink}"/><circle cx="${125+px}" cy="${88+py}" r="10" fill="${ink}"/><circle cx="${79+px}" cy="${84+py}" r="3.5" fill="#fff"/><circle cx="${129+px}" cy="${84+py}" r="3.5" fill="#fff"/></g>`;
    if(sad)eyes+=`<path d="M54 72L92 60M146 72L108 60" stroke="${ink}" stroke-width="6" stroke-linecap="round"/><path d="M62 110Q57 122 64 125Q71 120 62 110Z" fill="#6EC8FF"/>`;
    if(think)eyes+=`<text x="148" y="40" font-size="30">❓</text>`;}
  const beak=happy?`<path d="M86 102Q100 136 114 102Z" fill="#FFA928"/><ellipse cx="100" cy="114" rx="7" ry="5" fill="#E8505B"/>`:sad?`<path d="M90 108L110 108L100 122Z" fill="#FFA928"/>`:`<path d="M90 100L110 100L100 120Z" fill="#FFA928"/>`;
  const a=cheer?150:sad?4:14;
  return `<svg class="owl ${s}" viewBox="0 0 200 210" role="img" aria-label="Hoot the owl"><g class="all">
  <ellipse cx="78" cy="192" rx="18" ry="8" fill="#FFA928"/><ellipse cx="122" cy="192" rx="18" ry="8" fill="#FFA928"/>
  <ellipse cx="38" cy="120" rx="17" ry="40" fill="#6446E0" transform="rotate(${a} 42 92)"/>
  <ellipse cx="162" cy="120" rx="17" ry="40" fill="#6446E0" transform="rotate(${-a} 158 92)"/>
  <path d="M42 62L52 18L88 46Z M158 62L148 18L112 46Z" fill="#6446E0"/>
  <ellipse cx="100" cy="116" rx="70" ry="74" fill="#7C5CFF"/>
  <ellipse cx="100" cy="140" rx="44" ry="46" fill="#FFE9A8"/>
  <path d="M82 138q6 8 12 0M100 150q6 8 12 0M70 156q6 8 12 0M110 132q6 8 12 0" fill="none" stroke="#F5C96A" stroke-width="4" stroke-linecap="round"/>
  <circle cx="75" cy="88" r="27" fill="#fff" opacity=".35"/><circle cx="125" cy="88" r="27" fill="#fff" opacity=".35"/>
  ${eyes}
  <circle cx="52" cy="112" r="8" fill="#FF8FB1" opacity=".7"/><circle cx="148" cy="112" r="8" fill="#FF8FB1" opacity=".7"/>
  ${beak}
  ${happy?`<text x="8" y="40" font-size="26">✨</text><text x="160" y="50" font-size="22">⭐</text>`:''}
  </g></svg>`;
}

EX.split('\n').forEach((l,i)=>{const[p,ws]=l.split(':'),s=p.endsWith('-');FAM.push({id:p.replace('-',''),s:s?1:0,c:`hsl(${(i*37+10)%360} 62% 42%)`,w:ws.split(',').map(w=>[w,'🔤','Listen and spell!'])})});
const EY=`~ll~:bell,ball,doll,spell,yellow,balloon
~ss~:grass,dress,kiss,glass,class,lesson
~tt~:butter,letter,better,kitten,mitten,button
~ff~:off,stuff,cliff,puff,coffee,muffin
~pp~:happy,puppy,apple,hippo,puppet,slipper
~rr~:carrot,mirror,berry,sorry,hurry,arrow
~nn~:funny,bunny,dinner,tennis,penny,winner
~mm~:swimming,summer,hammer,tummy,drummer,grammar
~dd~:ladder,puddle,daddy,middle,paddle,riddle
~gg~:egg,bigger,wiggle,giggle,luggage,buggy
~bb~:rabbit,bubble,rubber,hobby,ribbon,pebble
~zz~:buzz,fizz,jazz,puzzle,dizzy,blizzard
~cc~:soccer,success,accident,accept,account,occur
~oi~:oil,coin,point,noise,voice,spoil
~oy~:oyster,royal,loyal,voyage,employ,enjoy
~ou~:house,mouse,cloud,mouth,shout,proud
~au~:sauce,august,author,laundry,haunt,pause
~aw~:lawn,dawn,yawn,hawk,crawl,awful
~ea~:bread,head,beach,dream,leaf,season
~oa~:boat,goal,toast,soap,coach,toaster
~oo~:moon,food,tooth,school,spoon,cool
~ai~:wait,paint,brain,afraid,mailbox,raining
~ei~:ceiling,receive,neighbor,weigh,eight,vein
~ir~:bird,girl,shirt,first,circle,birthday
~ur~:turn,burn,nurse,purple,turtle,surf
~or~:corn,horse,storm,fork,north,sport
~ough~:through,tough,cough,enough,rough,dough
~sh~:fishing,washing,bushes,ashes,dishes,wishes
~th~:bathroom,mother,brother,feather,weather,panther
~ck~:chicken,pocket,jacket,rocket,ticket,sticker
~ph~:dolphin,elephant,alphabet,telephone,trophy,graph
~ee~:green,sleep,queen,sheep,sweet,three
~ch~:teacher,kitchen,peaches,sandwich,watching,catching`;
EY.split('\n').forEach((l,i)=>{const[p,ws]=l.split(':'),pat=p.replace(/~/g,'');FAM.push({id:'m_'+pat,pat,m:1,k:'…'+pat+'…',c:`hsl(${(i*29+200)%360} 62% 42%)`,w:ws.split(',').map(w=>[w,'🔤','Listen and spell!'])})});
let filt='all';
/* ---------- Helpers ---------- */
let sound=true,ac;
function beep(f,d=.15,t='sine',when=0){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(ac.destination);const s=ac.currentTime+when;o.start(s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.stop(s+d)}catch(e){}}
const yay=()=>[523,659,784,1047].forEach((f,i)=>beep(f,.18,'triangle',i*.1));
const oops=()=>{beep(220,.2,'sawtooth');beep(165,.3,'sawtooth',.18)};
function say(t,r=.8){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=r;u.lang='en-US';speechSynthesis.speak(u)}catch(e){}}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));scrollTo(0,0)}
function confetti(){const e=['🎉','⭐','🎈','✨','🍭','💜'];for(let i=0;i<26;i++){const s=document.createElement('span');s.className='conf';s.textContent=e[i%e.length];s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),4000)}}
let best={};try{best=JSON.parse(localStorage.getItem('hootBest')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('hootBest',JSON.stringify(best))}catch(e){}};
/* ---------- Home ---------- */
$('heroOwl').innerHTML=owl('idle');
$('moods').innerHTML=[['idle','Hello'],['happy','Yay!'],['cheer','Hooray'],['think','Hmm…'],['sad','Oops'],['sleep','Zzz']].map(m=>`<div class="mood">${owl(m[0])}${m[1]}</div>`).join('');
function renderGrid(){$('grid').innerHTML=FAM.filter(f=>filt==='all'||(filt==='end'?!f.s&&!f.m:filt==='start'?!!f.s:!!f.m)).map(f=>{const b=best[f.id]||0;return `<button class="fam" data-id="${f.id}" style="background:${f.c}"><b>${f.k||(f.s?f.id+'-':'-'+f.id)}</b><small>${f.w.slice(0,2).map(w=>w[0]).join(', ')}…</small><div class="st">${'⭐'.repeat(b)}${'☆'.repeat(Math.max(0,18-b)>0?0:0)}${b?'':'☆☆☆'}</div></button>`}).join('')}
renderGrid();
$('grid').onclick=e=>{const b=e.target.closest('.fam');if(b)start(b.dataset.id)};
/* ---------- Game ---------- */
let fam,list,i,word,tiles,slots,mistakes,hintN,stars,busy;
function start(id){fam=id==='mix'?{id:'mix',n:0,c:'#FF7B00',w:[...new Map(FAM.flatMap(f=>f.w).concat(mine.map(w=>[w,'⭐','Listen and spell!'])).map(x=>[x[0],x])).values()]}:id==='mine'?{id:'mine',n:0,c:'#FF6FB1',w:mine.map(w=>[w,'⭐','Listen and spell!'])}:FAM.find(f=>f.id===id);list=shuffle(fam.w).slice(0,fam.id==='mix'?10:6);i=0;stars=0;show('game');document.documentElement.style.setProperty('--fc',fam.c);load()}
function load(){
  const w=list[i];word=w[0];tiles=shuffle([...word].map(c=>({c,used:false})));slots=[];mistakes=0;hintN=0;busy=false;
  $('pic').textContent=w[1];$('clue').textContent=w[2];$('gOwl').innerHTML=owl('think');
  $('prog').innerHTML=list.map((_,k)=>`<div class="dot ${k<i?'done':k===i?'now':''}"></div>`).join('');
  draw();setTimeout(()=>say(word),300);
}
function draw(popLast){
  const n=word.length,endN=fam.n??(fam.pat||fam.id).length,ix=fam.m?word.indexOf(fam.pat):0;
  $('slots').innerHTML=[...word].map((_,j)=>`<div class="slot ${(f=>f.m?(ix>=0&&j>=ix&&j<ix+endN):f.s?j<endN:j>=n-endN)(fam)?'end':''} ${popLast&&j===slots.length-1?'pop':''}">${slots[j]!==undefined?tiles[slots[j]].c:''}</div>`).join('');
  $('tiles').innerHTML=tiles.map((t,k)=>`<button class="tile ${t.used?'used':''}" data-k="${k}">${t.c}</button>`).join('');
}
function place(k){
  if(busy||tiles[k].used||slots.length>=word.length)return;
  tiles[k].used=true;slots.push(k);beep(500+slots.length*60,.08);draw(true);
  if(slots.length===word.length)check();
}
function undo(){if(busy||!slots.length)return;tiles[slots.pop()].used=false;draw()}
function check(){
  busy=true;
  if(slots.map(k=>tiles[k].c).join('')===word){
    yay();confetti();$('gOwl').innerHTML=owl('cheer');say(word);
    stars+=mistakes===0?3:mistakes===1?2:1;
    setTimeout(()=>{i++;i<list.length?load():finish()},1700);
  }else{
    mistakes++;oops();$('gOwl').innerHTML=owl('sad');
    $('slots').classList.add('shake');
    setTimeout(()=>{$('slots').classList.remove('shake');slots.forEach(k=>tiles[k].used=false);slots=[];busy=false;$('gOwl').innerHTML=owl('think');draw()},900);
  }
}
function hint(){
  if(busy)return;mistakes++;hintN=Math.min(hintN+1,word.length-1);
  slots.forEach(k=>tiles[k].used=false);slots=[];
  for(let j=0;j<hintN;j++){const k=tiles.findIndex(t=>!t.used&&t.c===word[j]);tiles[k].used=true;slots.push(k)}
  draw();
}
function finish(){
  const max=list.length*3,r=stars/max,out=r>.8?3:r>.5?2:1;
  best[fam.id]=Math.max(best[fam.id]||0,out);save();
  $('eOwl').innerHTML=owl(out>1?'cheer':'happy');
  $('eTxt').textContent=out===3?'Spelling superstar!':out===2?'Great job!':'Nice try! Practice makes perfect!';
  $('eStars').textContent='⭐'.repeat(out)+' '+stars+' / '+max;
  show('end');yay();confetti();renderGrid();
}
$('tiles').onclick=e=>{const b=e.target.closest('.tile');if(b)place(+b.dataset.k)};
$('slots').onclick=undo;$('undo').onclick=undo;$('hint').onclick=hint;
$('say').onclick=()=>say(word);
function slow(){try{speechSynthesis.cancel();[.4,.3].forEach(r=>{const u=new SpeechSynthesisUtterance(word);u.rate=r;u.lang='en-US';speechSynthesis.speak(u)})}catch(e){}}
$('slow').onclick=slow;
/* ---------- My Words ---------- */
let mine=[];try{mine=JSON.parse(localStorage.getItem('hootMine')||'[]')}catch(e){}
const parseW=t=>[...new Set(t.toLowerCase().split(/[^a-z]+/).filter(w=>w.length>1&&w.length<=14))];
$('chips').onclick=e=>{const b=e.target.closest('[data-f]');if(b){filt=b.dataset.f;renderGrid()}};
$('mixBtn').onclick=()=>start('mix');
$('myBtn').onclick=()=>{$('cText').value=mine.join(', ');$('cMsg').textContent='';show('custom')};
$('cBack').onclick=()=>show('home');
$('cPlay').onclick=()=>{const w=parseW($('cText').value);if(!w.length){$('cMsg').textContent='Add at least one word first!';return}mine=w;try{localStorage.setItem('hootMine',JSON.stringify(mine))}catch(e){}start('mine')};
let smp=null;(async()=>{try{if(window.claude&&claude.use){const s=await claude.use('sample');if(s&&(await s.limits()).images)smp=s}}catch(e){}void 0})();
$('scan').onclick=()=>$('file').click();
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const pv=$('prev');pv.src=URL.createObjectURL(f);pv.style.display='block';if(smp)return window.claudeScan(e);let got=[];try{if('TextDetector' in window){const bm=await createImageBitmap(f);const r=await new TextDetector().detect(bm);got=parseW(r.map(x=>x.rawValue).join(' '))}}catch(er){}if(got.length){$('cText').value=parseW($('cText').value).concat(got).filter((w,i,a)=>a.indexOf(w)===i).join(', ');$('cMsg').textContent='Found '+got.length+' words! Check the list, then Practice.'}else $('cMsg').textContent='Photo added above. Type the words you see into the box. Tip: on iPhone or iPad, tap and hold in the box and choose “Scan Text”; on Samsung, use the keyboard’s text-scan button.';e.target.value=''};
window.claudeScan=async e=>{const f=e.target.files[0];if(!f)return;$('cMsg').textContent='🔍 Hoot is reading…';try{const r=await smp('Read the spelling words in this photo. Reply with ONLY the words, lowercase, separated by commas.',{images:[f]});const got=parseW(r.text);$('cText').value=parseW($('cText').value).concat(got).filter((w,i,a)=>a.indexOf(w)===i).join(', ');$('cMsg').textContent=got.length?'Found '+got.length+' words! Check the list, then Practice.':'No words found. Try a clearer photo.'}catch(er){$('cMsg').textContent='Couldn’t scan that. You can type the words instead.'}e.target.value=''};
$('back').onclick=()=>{speechSynthesis&&speechSynthesis.cancel();show('home')};
$('home2').onclick=()=>show('home');$('again').onclick=()=>start(fam.id);
addEventListener('keydown',e=>{
  if(!$('game').classList.contains('on'))return;
  if(e.key==='Backspace')return undo();
  if(/^[a-z]$/i.test(e.key)){const k=tiles.findIndex(t=>!t.used&&t.c===e.key.toLowerCase());if(k>-1)place(k)}
});
</script></body></html>
