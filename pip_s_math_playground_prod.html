<title>Pip’s Math Playground (P4–P6)</title>
<style>
:root{--bg:#f6f4ff;--card:#fff;--text:#2a2250;--muted:#6b6490;--line:#e4defa;--pri:#7c5cff;--ok:#1fa968;--bad:#e5484d;--yel:#ffd23f;--a:#7c5cff;--b:#22b573;--c:#ffb300;--r:#ff5c7a;

:root[data-theme="dark"]{--bg:#16122b;--card:#221c42;--text:#f1eeff;--muted:#a79fd0;--line:#352d5e;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;font-size:17px;line-height:1.45}

.pill{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:4px 12px;font-weight:800;white-space:nowrap}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--pri);color:#fff;border:0;border-radius:14px;padding:10px 18px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.2)}

input.num.sm{width:46px;font-size:1.7rem;padding:0;border-radius:10px;border-color:var(--pri)}
.msg{font-weight:700;min-height:1.5em}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{background:var(--card);border:0;padding:6px 12px;font-weight:700}.seg button.on{background:var(--pri);color:#fff}
.hint{border:2px dashed var(--c);border-radius:16px;padding:12px;background:color-mix(in srgb,var(--c) 10%,transparent)}
.dots{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:6px 0}
.dot{width:16px;height:16px;border-radius:50%;background:var(--a);display:inline-block;position:relative}
.dot.b{background:var(--b)}.dot.c{background:var(--c)}.dot.r{background:var(--r)}
.dot.x{opacity:.4}.dot.x::after{content:"";position:absolute;left:-2px;right:-2px;top:7px;height:3px;background:var(--text);transform:rotate(-35deg)}
.gap{width:14px}

.bh{width:28px;height:28px;border-radius:4px;background:var(--a)}.bh.b{background:var(--b)}.bh.r{background:var(--r)}
.bt{width:9px;height:28px;border-radius:3px;background:var(--a)}.bt.b{background:var(--b)}.bt.r{background:var(--r)}
.bo{width:9px;height:9px;border-radius:50%;background:var(--a)}.bo.b{background:var(--b)}.bo.r{background:var(--r)}
.vis{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:8px 0}
.vis .op{font-size:2rem;font-weight:900}
.grid2{display:grid;gap:3px;margin:8px 0}
.groups{display:flex;gap:8px;flex-wrap:wrap}.groups>div{border:2px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-wrap:wrap;gap:3px;max-width:120px}
.area{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}.area div{border:2px solid var(--a);border-radius:10px;padding:8px 12px;font-weight:800;text-align:center}

.stack .sgn{text-align:center;color:var(--muted)}

@keyframes pulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--c) 45%,transparent)}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:700}.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.tt{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.tt button{background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:6px;font-weight:800;text-align:left}.tt button.on{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 14%,transparent)}
h2{margin:0 0 8px;font-size:1.35rem}h3{margin:12px 0 4px;font-size:1.1rem}
ul{margin:4px 0;padding-left:22px}
.a-bounce{animation:bounce 1.6s ease-in-out infinite;transform-origin:50% 90%}.a-hop{animation:hop .7s ease-in-out infinite;transform-origin:50% 90%}.a-shake{animation:shake .5s ease-in-out 2;transform-origin:50% 90%}
@keyframes bounce{50%{transform:translateY(-5px)}}@keyframes hop{50%{transform:translateY(-14px)}}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
html{-webkit-text-size-adjust:100%}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:44px}
#root{max-width:980px}
.btn{min-height:46px}
.stack{--cw:clamp(42px,12vw,60px);font-size:clamp(1.6rem,7vw,2.1rem)}
.stack .cell{height:var(--cw);line-height:var(--cw)}
.chim{height:calc(var(--cw)*.85);font-size:clamp(1rem,4.5vw,1.4rem)}
input.num.sm{width:calc(var(--cw) - 6px);height:calc(var(--cw) - 6px);font-size:clamp(1.4rem,6vw,1.8rem)}
.q{font-size:clamp(1.9rem,8vw,2.8rem)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.sp{background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:8px;text-align:center;font-weight:800;font-size:.9rem;width:100%}
.sp svg{width:100%;height:auto;display:block}
.sp.lock svg{filter:brightness(0) opacity(.18)}
.sp small{display:block;color:var(--muted);font-weight:600;font-size:.75rem}
.modal{position:fixed;inset:0;background:rgba(20,12,50,.65);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));z-index:50}
.sheet{background:var(--card);border-radius:24px;max-width:440px;width:100%;max-height:92vh;overflow:auto;padding:18px;text-align:center;border:3px solid var(--pri)}
.sheet svg{width:min(230px,58vw);height:auto}
.bar{display:flex;gap:6px}.bar i{flex:1;height:14px;border-radius:7px;background:var(--line)}.bar i.on{background:var(--yel)}
.badge{display:inline-block;background:var(--pri);color:#fff;border-radius:99px;padding:2px 12px;font-size:.8rem;font-weight:800}
@media (min-width:700px){#root{padding:22px 28px 60px}body{font-size:18px}.stack{--cw:68px;font-size:2.4rem}.q{font-size:3.2rem}.tiles{grid-template-columns:repeat(3,1fr)}.cgrid{grid-template-columns:repeat(5,1fr)}.tile big{font-size:2.8rem}}
@media (max-width:560px){.hero{flex-direction:column;align-items:stretch;text-align:center}.hero .pip{width:min(130px,36vw)!important;margin:0 auto}.hero .bubble{text-align:left}.q{justify-content:center}.hero .row{justify-content:center}header h1{font-size:1.05rem}.tiles{grid-template-columns:repeat(2,1fr);gap:10px}.tile big{font-size:2rem}.btn{padding:10px 14px}.cgrid{grid-template-columns:repeat(2,1fr)}.pill{padding:2px 9px;font-size:.9rem}}
.say{display:flex;gap:10px;align-items:center;margin:10px 0}.say .pip{width:82px!important;flex:none}
.eq{font-weight:800;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:4px 10px;margin:4px 0}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:8px 0}
.minicard{border:2px solid var(--line);border-radius:14px;padding:10px;background:var(--card)}.minicard>b{display:block;margin-bottom:4px}
.chip{display:inline-block;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:2px 10px;margin:3px;font-weight:800}.chip small{color:var(--muted)}
.pv{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.pvc{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:6px 2px;text-align:center;display:flex;flex-direction:column;min-height:92px;overflow-wrap:anywhere}
.pvc small{font-size:.66rem;color:var(--muted);font-weight:700}.pvc b{font-size:1.9rem}.pvc span{font-size:.68rem}.pvc.off{opacity:.35}
.rl{width:100%;max-width:520px;display:block;margin:6px auto}
.rl text{fill:var(--text);font-weight:800;font-size:14px;font-family:inherit}.rl line{stroke:var(--text)}
.rl .rb{fill:var(--card);stroke:var(--text);stroke-width:2}.rl .mid{stroke:#ff9a3c}.rl text.mt{fill:#ff9a3c}
.clock{width:min(280px,76vw);display:block;margin:6px auto}
.clock text{fill:var(--text);font-weight:800;font-family:inherit}.clock .face{fill:var(--card);stroke:var(--text);stroke-width:3}.clock .tk{stroke:var(--text)}.clock text.ml{fill:#ff5c7a}
.rbox{font-size:2rem;font-weight:900;letter-spacing:.08em;min-height:56px;border:3px dashed var(--line);border-radius:14px;padding:4px 12px;margin:6px 0;display:flex;align-items:center;justify-content:center;word-break:break-all}
.key{min-width:48px;font-size:1.3rem;font-weight:900}
.mc{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;max-width:420px;margin:6px 0}
.mcb{min-height:0;aspect-ratio:1;font-size:.7rem;padding:0;border:1px solid var(--line);background:var(--bg);border-radius:6px;font-weight:700}
.mcb.on{background:color-mix(in srgb,var(--pri) 28%,transparent)}.mcb.hit{background:var(--yel);color:#2a2250}
@media (max-width:560px){.say{align-items:flex-start}.say .pip{width:64px!important}.pvc b{font-size:1.5rem}}
.gcv{width:100%;max-width:420px;display:block;margin:0 auto;border-radius:18px;border:3px solid var(--line);touch-action:none;background:#1b1640;user-select:none;-webkit-user-select:none}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px;margin:10px auto}
.sqr{position:relative;aspect-ratio:1;border:3px solid var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:clamp(1.1rem,5vw,1.6rem);font-weight:900;background:var(--bg)}
.sqr.done{background:color-mix(in srgb,var(--ok) 25%,transparent);border-color:var(--ok)}
.sqr.cur{border-color:var(--yel);animation:pulse .9s infinite}
.tok{position:absolute;bottom:-6px;right:-6px;width:52%;pointer-events:none}.tok svg{width:100%;height:auto}

/* Same four-column grid and button sizing as the initial curriculum keypad. */
.shared-number-field{display:inline-block;vertical-align:top;width:100%;max-width:100%;font-size:1rem}
.shared-number-pad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:8px 0;width:100%;font-size:1rem}
.shared-number-pad button,.ls .shared-number-pad button{min-height:50px;font-size:1.25rem;padding:0;margin:0;width:100%;min-width:0}
.shared-keypad-host{width:100%;margin:8px 0}

.lesson-method li{margin:10px 0;line-height:1.6}.example-tiles{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.example-tiles span{border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--card)}.fraction-strip{display:flex;width:100%;max-width:500px;margin:8px 0}.fraction-strip span{flex:1;min-width:0;border:1px solid var(--line);text-align:center;padding:12px 0}.fraction-strip .shaded{background:var(--pri);color:white}.worked-example li{padding:8px;line-height:1.5}.answer-help{font-size:.95rem;line-height:1.5}.ls summary{cursor:pointer;padding:12px;font-weight:bold}.ls progress{width:100%;height:20px}
</style>

<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
const {useState,useEffect,useRef}=React,H=React.createElement;
/* Always-visible four-column keypad, matching the original exercise layout. */
const NumericInput=React.forwardRef(function NumericInput(props,forwardedRef){
 const ref=useRef(null),[host,setHost]=useState(null);
 const {onChange,...rest}=props;
 const small=/\bsm\b/.test(props.className||"");
 useEffect(()=>{
  if(!small)return;
  const bubble=ref.current&&ref.current.closest(".bubble");if(!bubble)return;
  const node=document.createElement("div");node.className="shared-keypad-host";
  const controls=Array.from(bubble.children).find(x=>x.classList.contains("row"));
  bubble.insertBefore(node,controls||null);setHost(node);
  return()=>node.remove();
 },[small]);
 const setRef=node=>{ref.current=node;if(typeof forwardedRef==="function")forwardedRef(node);else if(forwardedRef)forwardedRef.current=node};
 const press=k=>{
  const el=ref.current;if(!el||props.disabled||props.readOnly)return;
  const v=String(props.value==null?"":props.value),a=el.selectionStart==null?v.length:el.selectionStart,b=el.selectionEnd==null?a:el.selectionEnd;
  let value,pos;
  if(k==="⌫"){value=v.slice(0,a===b?Math.max(0,a-1):a)+v.slice(b);pos=a===b?Math.max(0,a-1):a}
  else{value=v.slice(0,a)+k+v.slice(b);pos=a+k.length}
  if(props.maxLength!=null&&value.length>props.maxLength)return;
  if(onChange)onChange({target:{value},currentTarget:{value},type:"change"});
  el.focus();requestAnimationFrame(()=>{if(el.isConnected)try{el.setSelectionRange(Math.min(pos,el.value.length),Math.min(pos,el.value.length))}catch(e){}});
 };
 const keys=["1","2","3","4","5","6","7","8","9","0",".","-","/",":","£","⌫"];
 const keypad=H("div",{className:"pad shared-number-pad",role:"group","aria-label":(props["aria-label"]||"Number")+" keypad"},keys.map(k=>H("button",{key:k,type:"button",className:"btn sec",disabled:!!props.disabled||!!props.readOnly||(props.inputMode==="numeric"&&!/^[0-9⌫]$/.test(k)),"aria-label":k==="⌫"?"Delete":k,onPointerDown:e=>e.preventDefault(),onClick:()=>press(k)},k)));
 const input=H("input",{...rest,inputMode:"none",ref:setRef,onChange});
 return small?H(React.Fragment,null,input,host&&ReactDOM.createPortal(keypad,host)):H("span",{className:"shared-number-field"},input,keypad);
});
function h(type,props,...children){
 if(type==="input"&&props&&/\bnum\b/.test(props.className||"")&&props["data-numeric"]!==false)return H(NumericInput,props,...children);
 return H(type,props,...children);
}
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,num=d=>d===""||d==null?0:+d;
/* ---------- storage (localStorage only, no cookies) ---------- */
const KEY="pip-math-v2",fresh=()=>({stars:0,best:0,lvl:{},stats:{},touched:false,right:0,rewards:[],grw:[],gw:{}});
const win=d=>{const r=(d.right||0)+1,rw=d.rewards||[];return {right:r,rewards:r%5===0&&rw.length<30?[...rw,rw.length]:rw}};
const load=()=>{for(const k of [KEY,"pip-math-v1"]){try{const v=JSON.parse(localStorage.getItem(k));if(v&&v.stats)return {cm:{},...v}}catch(e){}}return fresh()};
const save=d=>{try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}};
const wipe=()=>{try{localStorage.removeItem(KEY);localStorage.removeItem("pip-math-v1")}catch(e){}};
/* ---------- Pip sprites ---------- */
const C={body:"#7c5cff",dark:"#5a3fd6",belly:"#a99bff",ink:"#2a2250",yel:"#ffd23f",pink:"#ff8fb1"};
const arm=d=>`<path d="${d}" fill="none" stroke="${C.dark}" stroke-width="13" stroke-linecap="round"/>`;
const ARMS={down:arm("M44 128 Q28 148 36 166")+arm("M156 128 Q172 148 164 166"),up:arm("M44 122 Q22 98 30 70")+arm("M156 122 Q178 98 170 70"),wave:arm("M44 128 Q28 148 36 166")+arm("M156 122 Q180 100 172 72"),chin:arm("M44 128 Q28 148 36 166")+arm("M156 128 Q160 150 128 146"),shrug:arm("M46 124 Q24 130 22 112")+arm("M154 124 Q176 130 178 112"),hips:arm("M46 122 Q22 132 52 156")+arm("M154 122 Q178 132 148 156")};
const dot=(x,y,dx=0,dy=0)=>`<circle cx="${x}" cy="${y}" r="12" fill="#fff"/><circle cx="${x+dx}" cy="${y+dy}" r="7" fill="${C.ink}"/><circle cx="${x+dx+2}" cy="${y+dy-2}" r="2.4" fill="#fff"/>`;
const arc=(x,u)=>`<path d="M${x-10} ${u?110:104} Q${x} ${u?94:116} ${x+10} ${u?110:104}" fill="none" stroke="${C.ink}" stroke-width="5" stroke-linecap="round"/>`;
const star=x=>`<text x="${x}" y="116" font-size="26" text-anchor="middle" fill="${C.yel}" stroke="${C.ink}" stroke-width="1.5">★</text>`;
const EYES={open:dot(78,106)+dot(122,106),happy:arc(78,1)+arc(122,1),wink:dot(78,106)+arc(122,1),up:dot(78,106,3,-4)+dot(122,106,3,-4),worry:dot(78,108,0,3)+dot(122,108,0,3)+`<path d="M64 90 L90 96 M136 90 L110 96" stroke="${C.ink}" stroke-width="4" stroke-linecap="round"/>`,closed:arc(78,0)+arc(122,0),stars:star(78)+star(122)};

{n:"Sir Pip the Brave",h:["helm","#b8c4d4"],k:["cape","#e5484d"],o:["sword"],s:"Sir Pip guards the Castle of Numbers. When a sum looks as big as a dragon, he tackles it one column at a time and always wins."},
{n:"King Pip the Wise",h:["crown","#ffd23f"],k:["cape","#7a1fa2"],s:"King Pip rules the Kingdom of Tables. His royal secret: every times table is just repeated adding, and a good king never forgets it."},
{n:"Pip the Archer",h:["hood","#2e8b57"],o:["bow"],s:"Pip never misses a target in the Number Forest. Aim, count carefully, and the answer lands right in the middle."},
{n:"Pip the Viking",b:ORG,h:["viking","#9aa4b2"],o:["axe"],s:"Pip sails icy seas, sharing treasure fairly. Twelve gold coins for three crewmates? Four each, and a mighty cheer!"},
{n:"Pip the Jester",b:BLU,h:["jester","#e5484d"],m:"big",s:"Pip juggles numbers for the royal court: 3, 6, 9, 12! The audience claps whenever a tricky sum turns out right."},
{n:"Pip the Wizard",h:["wizard","#3b3fb5"],o:["wand","#ffd23f"],f:["mustache"],s:"In the Tower of Tricks, Pip mixes spells with numbers. His favourite: any number times ten grows a magic zero."},
{n:"Dragon Pip",b:GRN,h:["horns","#ffb300"],k:["wings","#ff8a65"],m:"big",s:"Pip made friends with a dragon and borrowed its wings. Dragons love counting their gold in fives, so Pip does too!"},
{n:"Unicorn Pip",b:WHT,h:["unicorn"],e:"happy",s:"On Rainbow Hill, Pip’s horn glows whenever someone solves a puzzle. Today it’s shining extra bright!"},
{n:"Fairy Pip",b:PNK,h:["flowers"],k:["wings","#ffe0ef"],o:["wand","#ff8fb1"],e:"happy",s:"Fairy Pip scatters sparkles in sets of ten. Ten sparkles make one glitter star, just like ten ones make a ten."},
{n:"Elf Pip",b:TEAL,h:["elfhat","#2e8b57"],f:["ears"],s:"Deep in the Whispering Woods, Pip spots hidden patterns. Look: the digits in the 9 times table always add up to 9!"},
{n:"Astronaut Pip",b:WHT,h:["bubble","#ffffff"],o:["flag","#ff5c7a"],s:"Pip planted a flag on the Moon after counting down: 10, 9, 8… Subtraction got the rocket there safely."},
{n:"Star Guardian Pip",h:["hood","#2b3a8c"],k:["cape","#1b2466"],o:["glow","#4fc3ff"],s:"Pip protects the galaxy with a blade of pure starlight. It only glows brighter when the answer is right!"},
{n:"Alien Pip",b:GRN,h:["alien","#26914c"],e:"up",m:"big",s:"Pip comes from planet Zorp, where they count in tens too! Earth maths felt just like home."},
{n:"Robot Pip",b:GRY,h:["robot","#9aa4b2"],f:["robot"],s:"Beep boop! Pip’s circuits are quick, but he says a clever brain with a good hint is even better."},
{n:"Rocket Pilot Pip",b:ORG,h:["pilot","#e5484d"],f:["goggles","#ffb300"],m:"big",s:"Pip steers the rocket through an asteroid field of numbers. Dodge the wrong answers and zoom to the right ones!"},
{n:"Captain Pip",h:["pirate","#ffd23f"],f:["patch"],o:["sword"],s:"Captain Pip hunts buried treasure with maps full of sums. X marks the spot where the right answer lies!"},
{n:"Explorer Pip",b:ORG,h:["safari","#c9a46b"],o:["flag","#22b573"],s:"Pip hacks through the jungle to find the Lost Temple of Multiplication. Every correct answer opens one more door."},
{n:"Cowboy Pip",b:YEL,h:["cowboy","#a8693a"],f:["scarf","#e5484d"],m:"big",s:"Yeehaw! Pip counts cattle in groups: 7 cows in each of 6 fields makes 42. Nobody has lost a cow on Pip’s ranch."},
{n:"Deep-Sea Diver Pip",b:TEAL,f:["diver","#ffb300"],s:"Down in the blue, Pip counts fish in rows and shells in tens. The deeper the dive, the bigger the numbers!"},
{n:"Pharaoh Pip",b:BLU,h:["pharaoh","#ffd23f"],o:["ankh"],s:"Long ago, Pip helped build pyramids with careful counting. The ancient Egyptians were maths masters, and so is Pip."},
{n:"Ninja Pip",b:DRK,h:["ninja","#e5484d"],o:["sword","#e5484d"],s:"Silent, quick and accurate, Ninja Pip solves sums in a flash. A little practice every day makes the fastest ninja."},
{n:"Samurai Pip",b:RED,h:["samurai","#7a1f24"],o:["sword"],s:"Pip trains with patience and focus. A samurai checks every answer twice before calling a sum finished."},
{n:"Super Pip",b:BLU,f:["mask","#e5484d"],k:["cape","#e5484d"],m:"big",s:"With a mask and a cape, Super Pip rescues puzzled numbers. The secret power? Never giving up after a wrong answer!"},
{n:"Chef Pip",h:["chef"],o:["ladle"],m:"big",s:"Chef Pip scales recipes up and down. Doubling a dinner for 4 to feed 8? That’s multiplication on the menu!"},
{n:"Professor Pip",b:WHT,h:["hair","#ffffff"],f:["goggles","#22b573"],o:["flask","#4fc3ff"],s:"Professor Pip experiments with numbers in the lab. His big discovery: mistakes are the best clues in science."},

ll group.", "steps": ["Find an easy multiple of the divisor", "Subtract that chunk", "Divide the remaining amount", "Combine the groups and check the remainder"], "title": "Calculate 157 / 6", "worked": ["6 x 20 = 120, leaving 37", "6 x 6 = 36, leaving 1", "157 / 6 = 26 remainder 1", "Check: 26 x 6 + 1 = 157"], "warning": "A remainder must be smaller than the divisor. A story may require rounding up for an extra group."}, "C9": {"intro": "A decimal can be treated as tenths or hundredths while you multiply or divide.", "steps": ["Name the decimal unit", "Calculate with whole units", "Convert the result back to decimal form", "Check using the inverse operation"], "title": "Calculate 4.8 / 3", "worked": ["4.8 is 48 tenths", "48 / 3 = 16", "16 tenths is 1.6", "Check: 1.6 x 3 = 4.8"], "warning": "Keep the place value: 16 tenths is not 16 wholes."}, "C10": {"intro": "Operation order makes an expression have one agreed value.", "steps": ["Do brackets first", "Do powers if present", "Do multiplication and division from left to right", "Do addition and subtraction from left to right"], "title": "Calculate 18 - 6 / 3 + 2", "worked": ["Do division first: 6 / 3 = 2", "The expression becomes 18 - 2 + 2", "Work left to right: 16 + 2", "The answer is 18"], "warning": "Multiplication is not always before division, and addition is not always before subtraction."}, "C11": {"intro": "Inverse operations undo each other: addition with subtraction, multiplication with division.", "steps": ["Identify the operation", "Choose its inverse", "Undo the operation to find the missing value", "Substitute the answer into the original statement"], "title": "Solve a missing number: box x 4 = 28", "worked": ["Undo multiplying by 4 with division", "28 / 4 = 7", "The box is 7", "Check: 7 x 4 = 28"], "warning": "Check in the original equation, not only in the rearranged one."}, "C12": {"intro": "A word problem tells a mathematical story. Decide what is happening before choosing an operation.", "steps": tiply numerator and denominator by the same nonzero number", "Or divide both by a common factor", "Check that the whole stays the same", "Use simplest form when requested"], "title": "Simplify 6/8", "worked": ["6 and 8 share factor 2", "6 / 2 = 3 and 8 / 2 = 4", "6/8 = 3/4", "Both shade the same amount"], "warning": "Changing only the numerator or only the denominator changes the fraction's value."}, "F4": {"intro": "To find a fraction of an amount, first find one equal part and then take the required number of parts.", "steps": ["Divide the total by the denominator", "This gives one part", "Multiply by the numerator", "Check that a proper fraction gives less than the total"], "title": "Find 3/4 of 20", "worked": ["20 / 4 = 5 in one quarter", "Three quarters means three groups of 5", "5 x 3 = 15", "3/4 of 20 is 15"], "warning": "Divide by the denominator, not the numerator."}, "F5": {"intro": "Fractions, decimals and percentages are three ways to describe the same share.", "steps": ["A percentage means out of 100", "Convert a fraction by division or equivalent hundredths", "Multiply a decimal by 100 for percent", "Use familiar benchmark equivalents"], "title": "Convert 3/4", "worked": ["3 / 4 = 0.75", "3/4 = 75/100", "75 out of 100 means 75%", "3/4 = 0.75 = 75%"], "warning": "0.75 is 75%, not 0.75%."}, "F6": {"intro": "A percentage of an amount is a share out of one hundred equal shares.", "steps": ["Find 1% by dividing by 100, or use an easy benchmark", "Find 10% by dividing by 10", "Combine shares to reach the requested percent", "Check against the whole amount"], "title": "Find 15% of 80", "worked": ["10% of 80 is 8", "5% is half of 10%, so it is 4", "15% = 10% + 5%", "8 + 4 = 12"], "warning": "15% means 15 out of 100, not 15 added to the amount."}, "Y1": {"intro": "Coins and notes have values. Different combinations can make the same total.", "steps": ["Use 100p = \u00a31", "Convert values to one unit", "Add coin and note values", "Try another combination for th
